server {
    listen 8001;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Batas upload dan timeout
    client_max_body_size 40M;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;

    # Blok file tersembunyi atau sensitif
    location ~* /\.(env|git|htaccess|htpasswd|svn|DS_Store|idea|vscode|log|bak|sql|ini|yml|yaml|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blok akses ke folder Laravel non-public
    location ~* ^/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)/ {
        deny all;
    }

    # Khusus untuk symlink storage → storage/app/public
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;

        # Blok file berbahaya jika ada upload aneh
        location ~* \.(php|sh|log|env|ini|conf|bak|sql)$ {
            deny all;
        }
    }

    # Handle file PHP
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass sdi-madiun:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_read_timeout 600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Laravel route fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~* \.js$ {
        add_header Content-Type application/javascript;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'" always;
}
